<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Voz de Laura · Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="laura-voice.css?v=20260418e">
</head>
<body>

<div class="mesh"><div class="blob blob1"></div><div class="blob blob2"></div></div>

<header class="topbar">
  <a href="home.html" class="back-btn" aria-label="Volver" onclick="event.preventDefault(); if(history.length>1) history.back(); else location.href='home.html';">←</a>
  <div class="topbar-title">
    <span class="lv-dot"></span>
    <span>Voz de Laura · Test</span>
  </div>
  <button class="topbar-stop" id="stopBtn" onclick="stopAll()" aria-label="Detener">⏹</button>
</header>

<main class="lv-wrap">

  <!-- Input libero: scrivi + Leer -->
  <section class="lv-custom">
    <div class="lv-section-title" style="margin-bottom:8px;">✏️ Escribe y escucha</div>
    <textarea id="customText" class="lv-custom-input" placeholder="Escribe aquí la frase que quieras que Laura diga…" rows="2" maxlength="500"></textarea>
    <div class="lv-custom-foot">
      <span class="lv-custom-count" id="customCount">0/500</span>
      <button id="customReadBtn" class="lv-btn-read" onclick="readCustom()">🔊 Leer con voz de Laura</button>
    </div>
  </section>

  <div class="lv-section">
    <div class="lv-section-title">🟣 Frases cortas</div>
    <div class="lv-grid" id="gridShort"></div>
  </div>

  <div class="lv-section">
    <div class="lv-section-title">🟣🟣 Frases medias</div>
    <div class="lv-grid lv-grid-wide" id="gridMid"></div>
  </div>

  <div class="lv-section">
    <div class="lv-section-title">🟣🟣🟣 Frases largas</div>
    <div class="lv-grid lv-grid-wide" id="gridLong"></div>
  </div>

  <!-- Stats panel -->
  <section class="lv-stats" id="lvStats">
    <div class="lv-stats-head">
      <span class="lv-stats-label">ESTADÍSTICAS <span class="lv-stats-cachecount" id="stCacheEntries" title="Frases guardadas en caché persistente (IndexedDB)">· caché 0</span></span>
      <button class="lv-stats-clear" onclick="clearCache()">🗑️ Limpiar caché</button>
    </div>
    <div class="lv-stats-grid">
      <div class="lv-stats-cell">
        <div class="lv-stats-k">Reproducciones</div>
        <div class="lv-stats-v" id="stPlays">0</div>
      </div>
      <div class="lv-stats-cell">
        <div class="lv-stats-k">Desde caché</div>
        <div class="lv-stats-v" id="stCache">0</div>
      </div>
      <div class="lv-stats-cell">
        <div class="lv-stats-k">Chars enviados</div>
        <div class="lv-stats-v" id="stChars">0</div>
      </div>
      <div class="lv-stats-cell">
        <div class="lv-stats-k">Chars ahorrados</div>
        <div class="lv-stats-v" id="stSaved">0</div>
      </div>
      <div class="lv-stats-cell">
        <div class="lv-stats-k">~Coste sesión</div>
        <div class="lv-stats-v" id="stCostSession">$0.0000</div>
      </div>
      <div class="lv-stats-cell">
        <div class="lv-stats-k">~Coste histórico</div>
        <div class="lv-stats-v" id="stCostLifetime">$0.0000</div>
      </div>
    </div>
    <div class="lv-stats-foot">
      <div class="lv-stats-rate">
        Tasa: <button class="lv-rate-btn" onclick="editRate()"><span id="stRate">$0.065</span>/1K chars ✏️</button>
      </div>
      <a class="lv-billing-link" href="https://platform.minimax.io/user-center/basic-information/bill-info" target="_blank" rel="noopener">Ver billing MiniMax ↗</a>
    </div>
    <div class="lv-stats-note" id="stStatus">Toca una frase para empezar.</div>
  </section>

</main>

<script src="laura-voice.js?v=20260418e"></script>
<script>
// ─── Frasi di test (modificabili direttamente qui) ───
const PHRASES = {
  short: [
    'Hola',
    'Gracias',
    'Sí, por favor',
    'No, gracias',
    'Muy bien',
    'Te quiero',
    'Estoy cansada',
    'Tengo hambre',
  ],
  mid: [
    '¿Cómo estás hoy?',
    'Me encuentro bien, gracias',
    '¿Puedes ayudarme un momento?',
    'Hoy he dormido bastante bien',
    'Tengo ganas de salir a pasear',
  ],
  long: [
    'Hoy me he levantado con ganas de salir a pasear por el parque un rato.',
    'Estoy descansando en casa después de la rehabilitación de esta mañana, todo ha ido bien.',
    'Gracias por venir a verme, me alegra mucho tenerte aquí conmigo.',
    'Esta tarde me apetece ver una película tranquila y luego cenar algo ligero contigo.',
  ],
};

const $ = id => document.getElementById(id);

function renderGrid(containerId, phrases) {
  const el = $(containerId);
  el.innerHTML = '';
  phrases.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'lv-btn';
    btn.type = 'button';
    btn.innerHTML = `<span class="lv-btn-text">${text}</span><span class="lv-btn-state" aria-hidden="true"></span>`;
    btn.dataset.text = text;
    btn.onclick = () => onTap(btn, text);
    el.appendChild(btn);
  });
}

async function onTap(btn, text) {
  // Evita doppi tap mentre sta caricando
  if (btn.classList.contains('loading')) return;
  // Reset "playing" agli altri
  document.querySelectorAll('.lv-btn.playing, .lv-btn.loading').forEach(b => {
    if (b !== btn) b.classList.remove('playing', 'loading');
  });

  btn.classList.add('loading');
  setStatus('Generando…');

  try {
    const res = await window.fetchMiniMaxAudio(text, {
      onend: () => { btn.classList.remove('playing'); updateStats(); },
      onerror: () => { btn.classList.remove('playing', 'loading'); },
    });
    btn.classList.remove('loading');
    btn.classList.add('playing');
    if (res && res.fromCache) {
      btn.classList.add('cached');
      setStatus('⚡ Desde caché');
    } else {
      btn.classList.add('cached');
      setStatus('☁️ Generada y guardada en caché');
    }
    updateStats();
  } catch (err) {
    btn.classList.remove('loading', 'playing');
    setStatus('❌ Error: ' + (err.message || err));
  }
}

function updateStats() {
  const s = window.lauraVoiceStats ? window.lauraVoiceStats() : null;
  if (!s) return;
  $('stPlays').textContent = s.plays;
  $('stCache').textContent = s.cacheHits;
  $('stChars').textContent = s.charsSent;
  $('stSaved').textContent = s.charsSaved;
  $('stCostSession').textContent  = '$' + s.costSession.toFixed(4);
  $('stCostLifetime').textContent = '$' + s.costLifetime.toFixed(4);
  $('stRate').textContent = '$' + s.pricePer1K.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  $('stCacheEntries').textContent = '· caché ' + (s.cacheSize || 0);
}

function editRate() {
  const cur = window.lauraVoiceStats().pricePer1K;
  const v = prompt('Tasa MiniMax en USD por 1000 caracteres.\n\nCálculo desde tu dashboard:\n  (saldo inicial − saldo actual) / chars enviados × 1000\n\nActual: ' + cur, cur);
  if (v === null) return;
  const ok = window.setLauraPricePer1K(v);
  if (ok) {
    updateStats();
    setStatus('✅ Tasa actualizada a $' + parseFloat(v).toFixed(4) + '/1K chars.');
  } else {
    setStatus('❌ Valor inválido. Usa un número entre 0 y 10.');
  }
}

function setStatus(msg) { $('stStatus').textContent = msg; }

function stopAll() {
  if (window.stopLauraVoice) window.stopLauraVoice();
  document.querySelectorAll('.lv-btn').forEach(b => b.classList.remove('playing', 'loading'));
  setStatus('Detenido.');
}

async function clearCache() {
  if (window.clearLauraVoiceCache) {
    try { await window.clearLauraVoiceCache(); } catch (e) {}
  }
  document.querySelectorAll('.lv-btn.cached').forEach(b => b.classList.remove('cached'));
  setStatus('🧹 Caché vaciada (memoria + persistente). Las próximas llamadas irán a la API.');
  updateStats();
}

// ─── Input libero ───
const customInput = $('customText');
const customBtn   = $('customReadBtn');
const customCount = $('customCount');
const BTN_LABEL   = '🔊 Leer con voz de Laura';

function updateCustomCount() {
  const len = customInput.value.length;
  customCount.textContent = len + '/500';
}
customInput.addEventListener('input', () => {
  updateCustomCount();
  try { localStorage.setItem('parlia_laura_last_text', customInput.value); } catch(e) {}
});
// Restore ultimo testo digitato (sopravvive a refresh/chiusure)
try {
  const saved = localStorage.getItem('parlia_laura_last_text');
  if (saved) { customInput.value = saved; updateCustomCount(); }
} catch(e) {}

async function readCustom() {
  const text = customInput.value.trim();
  if (!text) { setStatus('Escribe algo primero.'); customInput.focus(); return; }
  if (customBtn.disabled) return;

  customBtn.disabled = true;
  customBtn.innerHTML = '⏳ Generando…';
  setStatus('Generando…');

  try {
    const res = await window.fetchMiniMaxAudio(text, {
      onend:   () => { customBtn.disabled = false; customBtn.innerHTML = BTN_LABEL; updateStats(); },
      onerror: () => { customBtn.disabled = false; customBtn.innerHTML = BTN_LABEL; },
    });
    customBtn.innerHTML = '🔊 Leyendo…';
    setStatus(res && res.fromCache ? '⚡ Desde caché' : '☁️ Generada y guardada en caché');
    updateStats();
  } catch (err) {
    customBtn.disabled = false;
    customBtn.innerHTML = BTN_LABEL;
    setStatus('❌ Error: ' + (err.message || err));
  }
}

// Init
renderGrid('gridShort', PHRASES.short);
renderGrid('gridMid',   PHRASES.mid);
renderGrid('gridLong',  PHRASES.long);
updateStats();

// Attendi il preload IndexedDB, poi aggiorna il counter + marca i bottoni
// preset le cui frasi sono già persistite (badge ⚡) così vedi subito
// quali riproduzioni sono gratis.
if (window.lauraVoiceReady) {
  window.lauraVoiceReady().then(() => {
    updateStats();
    const s = window.lauraVoiceStats();
    if (s.cacheSize > 0) {
      setStatus(`⚡ ${s.cacheSize} frase${s.cacheSize === 1 ? '' : 's'} en caché persistente — gratis al tocarlas.`);
    }
    // Pre-marca i bottoni preset già in cache
    if (window.isLauraCached) {
      document.querySelectorAll('.lv-btn').forEach(b => {
        const t = b.dataset.text;
        if (t && window.isLauraCached(t)) b.classList.add('cached');
      });
    }
  });
}
</script>
</body>
</html>
