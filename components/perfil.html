<!-- Perfil · contenuto della pagina 3 della home -->

<div class="yo-header">
  <div class="yo-avatar" id="yoAvatar">M</div>
  <div>
    <div class="yo-name-lbl" id="yoName">María</div>
    <div class="yo-sub-lbl">Institut Guttmann · Barcelona</div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-header">
    <span>Perfil completado</span>
    <span id="yoProgressPct" style="color:var(--blue)">50%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar" id="yoProgressBar" style="width:50%"></div>
  </div>
</div>

<!-- Resumen visual (solo lectura) -->
<div class="yo-summary">
  <div class="yo-info">
    <div class="yo-info-icon">👤</div>
    <div class="yo-info-label">Datos personales</div>
    <div class="yo-info-value" id="yoPersonal">—</div>
  </div>
  <div class="yo-info">
    <div class="yo-info-icon">🏥</div>
    <div class="yo-info-label">Condición</div>
    <div class="yo-info-value" id="yoCondicion">—</div>
  </div>
  <div class="yo-info">
    <div class="yo-info-icon">🤝</div>
    <div class="yo-info-label">Cuidador principal</div>
    <div class="yo-info-value" id="yoCuidador">—</div>
  </div>
  <div class="yo-info">
    <div class="yo-info-icon">🧠</div>
    <div class="yo-info-label">Memoria AI</div>
    <div class="yo-info-value" id="yoMemoria">—</div>
  </div>
  <div class="yo-info">
    <div class="yo-info-icon">⚙️</div>
    <div class="yo-info-label">Funciones activas</div>
    <div class="yo-info-value" id="yoFunciones">—</div>
  </div>
</div>

<!-- CTA unico para editar -->
<button class="yo-cta" onclick="window.location.href='profile.html'" style="margin-top:4px">
  <div class="yo-cta-icon">✏️</div>
  <div style="flex:1;text-align:left">
    <div class="yo-cta-label">Editar mi perfil</div>
    <div class="yo-cta-sub">Datos personales + memoria AI</div>
  </div>
  <div class="yo-cta-arrow">›</div>
</button>

<div class="yo-row" onclick="window.location.href='tutorial.html'" style="margin-top:4px">

  <div class="yo-row-arrow">›</div>
</div>
