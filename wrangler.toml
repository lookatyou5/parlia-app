name = "parlia-app"
type = "javascript"
main = "src/index.js"

[env.production]
name = "parlia-app"

[build]
command = ""

[build.upload]
format = "service-worker"

[[routes]]
pattern = "*"
zone_name = "parlia.app"

[site]
bucket = "."
include = ["*.html", "*.js", "*.css", "*.png", "*.svg", "*.json", "*.webp", "*.ico"]

[env.production.site]
bucket = "."

[compatibility_date]
date = "2024-01-01"
